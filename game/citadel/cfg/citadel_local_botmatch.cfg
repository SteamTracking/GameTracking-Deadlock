// Config for a client hosted local bot match server. Exec'd by CCitadelLocalMatchServer on the handoff, for both a
// spawned dedicated server and an in process listen server.

sv_matchmaking_enabled 0
tv_citadel_auto_record 0

tv_enable 0
tv_broadcast 0
tv_delay 0
sv_long_frame_ms 32
citadel_send_gc_match_info_s 0
citadel_pre_match_wait 10
citadel_upload_replay_enabled 0
sv_parallel_checktransmit 2

citadel_pregame_wait_duration 10

spec_replay_enable 0
citadel_server_all_players_disconnected_grace_period_s 20